name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix KSP Bug and Build
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle*" | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: settings.gradle not found!"
          exit 1
        fi
        
        cd $(dirname "$PROJECT_DIR")
        
        # ایجاد امضای دیجیتال
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        
        # دادن دسترسی اجرایی به wrapper
        chmod +x gradlew
        
        # اجرای بیلد با غیرفعال کردن اجرای موازی KSP (راه حل اصلی)
        ./gradlew assembleDebug -Dksp.useKSP2=false --no-daemon --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: secure-chat-final-apk
        path: "**/build/outputs/apk/debug/*.apk"
